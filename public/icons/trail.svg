<svg width="128" height="128" viewBox="0 0 128 128"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Node glow gradient -->
    <radialGradient id="node" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- edges -->
  <g stroke="#c7d2fe" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="64" y1="28" x2="44" y2="56"/>
    <line x1="64" y1="28" x2="84" y2="56"/>

    <line x1="44" y1="56" x2="34" y2="88"/>
    <line x1="44" y1="56" x2="54" y2="88"/>

    <line x1="84" y1="56" x2="74" y2="88"/>
    <line x1="84" y1="56" x2="94" y2="88"/>
  </g>

  <!-- nodes -->
  <g fill="url(#node)">
    <circle cx="64" cy="28" r="6"/>
    <circle cx="44" cy="56" r="6"/>
    <circle cx="84" cy="56" r="6"/>

    <circle cx="34" cy="88" r="6"/>
    <circle cx="54" cy="88" r="6"/>
    <circle cx="74" cy="88" r="6"/>
    <circle cx="94" cy="88" r="6"/>
  </g>

</svg>

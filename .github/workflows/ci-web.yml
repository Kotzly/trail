name: CI (web)

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-web.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest

    env:
      # Keep builds deterministic + quiet
      CI: true
      NEXT_TELEMETRY_DISABLED: "1"

      # Marketing build-time env. The shared-trail viewer and the
      # password-reset page need Supabase config — placeholder values
      # are fine for typecheck/build; runtime gets real values in
      # Vercel project env.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-placeholder
      NEXT_PUBLIC_SHARE_IMPORT_ENABLED: "false"
      NEXT_PUBLIC_APP_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Typecheck (marketing)
        run: pnpm --filter @trail/marketing typecheck

      - name: Build (marketing)
        run: pnpm --filter @trail/marketing build

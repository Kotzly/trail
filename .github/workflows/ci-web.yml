name: CI (web)

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-web.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest

    env:
      # Keep builds deterministic + quiet
      CI: true
      NEXT_TELEMETRY_DISABLED: "1"

      # Prisma generate + server modules expect these to exist.
      # They do NOT need to point to a real database for typecheck/build.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trail_ci

      TRAIL_EXTENSION_JWT_SECRET: test-extension-secret

      # Account auth + billing placeholders for build-time env checks.
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      BILLING_PROVIDER: manual
      BILLING_TEST_MODE: "1"
      NOWPAYMENTS_API_KEY: ""
      NOWPAYMENTS_IPN_SECRET: ""
      NOWPAYMENTS_API_BASE_URL: ""
      NEXT_PUBLIC_APP_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Typecheck (marketing/account)
        run: pnpm --filter @trail/marketing --filter @trail/account typecheck

      - name: Build (marketing)
        run: pnpm --filter @trail/marketing build

      - name: Build (account)
        run: pnpm --filter @trail/account build

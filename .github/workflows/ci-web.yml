name: CI (web)

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-web.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest

    env:
      # Keep builds deterministic + quiet
      CI: true
      NEXT_TELEMETRY_DISABLED: "1"

      # Prisma generate + server modules expect these to exist.
      # They do NOT need to point to a real database for typecheck/build.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trail_ci

      # Used by account/api internal fetch helpers.
      TRAIL_API_BASE_URL: http://localhost:3002
      TRAIL_INTERNAL_API_KEY: ci

      # Account app imports Auth0 client at module-load.
      AUTH0_BASE_URL: http://localhost:3001
      AUTH0_ISSUER_BASE_URL: https://example.auth0.com
      AUTH0_CLIENT_ID: ci
      AUTH0_CLIENT_SECRET: ci
      AUTH0_SECRET: 0123456789abcdef0123456789abcdef
      AUTH0_DOMAIN: example.auth0.com
      APP_BASE_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (marketing/account/api)
        run: pnpm --filter @trail/marketing --filter @trail/account --filter @trail/api typecheck

      - name: Build (marketing)
        run: pnpm --filter @trail/marketing build

      - name: Build (account)
        run: pnpm --filter @trail/account build

      - name: Build (api)
        run: pnpm --filter @trail/api build

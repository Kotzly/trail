name: CI (web)

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-web.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest

    env:
      # Keep builds deterministic + quiet
      CI: true
      NEXT_TELEMETRY_DISABLED: "1"

      # Prisma generate + server modules expect these to exist.
      # They do NOT need to point to a real database for typecheck/build.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trail_ci

      # Used by account/api internal fetch helpers.
      TRAIL_API_BASE_URL: http://localhost:3002
      TRAIL_INTERNAL_API_KEY: ci
      TRAIL_AUTH_BASE_URL: http://localhost:3003
      TRAIL_EXTENSION_JWT_SECRET: test-extension-secret
      WAITLIST_PROVIDER_ENDPOINT: http://localhost:3999/waitlist
      WAITLIST_PROVIDER_TOKEN: test-waitlist-token

      # API app auth + billing placeholders for build-time env checks.
      BETTER_AUTH_URL: http://localhost:3003
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3001,http://localhost:3003
      AUTH_BRIDGE_DEFAULT_RETURN_TO: http://localhost:3001
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      POLAR_WEBHOOK_SECRET: test-polar-secret
      APP_BASE_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (marketing/account/api/auth)
        run: pnpm --filter @trail/marketing --filter @trail/account --filter @trail/api --filter @trail/auth typecheck

      - name: Build (marketing)
        run: pnpm --filter @trail/marketing build

      - name: Build (account)
        run: pnpm --filter @trail/account build

      - name: Build (api)
        run: pnpm --filter @trail/api build

      - name: Build (auth)
        run: pnpm --filter @trail/auth build

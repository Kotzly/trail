name: CI (extension)

on:
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/ci-extension.yml"
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/ci-extension.yml"
  workflow_dispatch:

concurrency:
  group: ci-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

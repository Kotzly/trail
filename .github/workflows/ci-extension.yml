name: CI (extension)

on:
  pull_request:
    paths:
      - "extension/**"
      - ".github/workflows/ci-extension.yml"
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/ci-extension.yml"
  workflow_dispatch:

concurrency:
  group: ci-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build (firefox)
        run: pnpm build:firefox

      - name: Lint (firefox manifest, web-ext)
        run: pnpm dlx web-ext lint --source-dir=.output/firefox-mv2 --self-hosted

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (Playwright, headed via xvfb)
        run: xvfb-run --auto-servernum pnpm exec playwright test
        env:
          CI: "true"

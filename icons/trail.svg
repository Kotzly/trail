<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Trail path -->
  <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main vertical path -->
    <path d="M64 24 L64 64" opacity="0.9"/>
    <!-- Fork left -->
    <path d="M64 64 L40 104" opacity="0.7"/>
    <!-- Fork right -->
    <path d="M64 64 L88 104" opacity="0.7"/>
    <!-- Dots/nodes -->
  </g>
  <!-- Nodes -->
  <circle cx="64" cy="24" r="6" fill="#fff"/>
  <circle cx="64" cy="64" r="8" fill="#fff"/>
  <circle cx="40" cy="104" r="6" fill="#fff" opacity="0.8"/>
  <circle cx="88" cy="104" r="6" fill="#fff" opacity="0.8"/>
</svg>

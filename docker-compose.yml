services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trail
      POSTGRES_PASSWORD: trail
      POSTGRES_DB: trail
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trail"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      ENV: development
      LOG_LEVEL: info
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      REQUEST_TIMEOUT: 15s
      SHUTDOWN_TIMEOUT: 10s
      DATABASE_URL: postgres://trail:trail@postgres:5432/trail?sslmode=disable
      JWT_SECRET: local-dev-secret
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      PORTAL_BASE_URL: http://localhost:5173
      BILLING_PROVIDER: stripe_stub
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8080/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  migrate:
    image: migrate/migrate:v4.17.0
    profiles: ["tools"]
    volumes:
      - ./backend/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://trail:trail@postgres:5432/trail?sslmode=disable"]

volumes:
  pgdata:

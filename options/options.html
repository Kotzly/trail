<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack History Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Stack History Settings</h1>
      <p class="subtitle">Configure your browsing stack preferences</p>
    </header>

    <form id="settingsForm">
      <section class="section">
        <h2>Appearance</h2>
        
        <div class="field">
          <label>
            <span class="label-text">Theme</span>
            <span class="label-hint">Choose light, dark, or follow system</span>
          </label>
          <div id="themeOptions" class="theme-options">
            <label class="theme-option" data-theme="light">
              <input type="radio" name="theme" value="light">
              <span class="theme-icon">☀️</span>
              <span class="theme-label">Light</span>
            </label>
            <label class="theme-option" data-theme="dark">
              <input type="radio" name="theme" value="dark">
              <span class="theme-icon">🌙</span>
              <span class="theme-label">Dark</span>
            </label>
            <label class="theme-option" data-theme="system">
              <input type="radio" name="theme" value="system">
              <span class="theme-icon">💻</span>
              <span class="theme-label">System</span>
            </label>
          </div>
        </div>
      </section>

      <section class="section">
        <h2>Display Mode</h2>
        
        <div class="field">
          <label>
            <span class="label-text">View Mode</span>
            <span class="label-hint">Choose how navigation history is displayed</span>
          </label>
          <div id="viewModeOptions" class="view-mode-options">
            <!-- Dynamically populated -->
          </div>
        </div>
      </section>

      <section class="section">
        <h2>Stack Configuration</h2>
        
        <div class="field">
          <label for="stackCapacity">
            <span class="label-text">Stack Capacity</span>
            <span class="label-hint">Maximum number of pages to remember per tab</span>
          </label>
          <div class="input-group">
            <input 
              type="number" 
              id="stackCapacity" 
              name="stackCapacity" 
              min="10" 
              max="1000" 
              step="10"
              required
            >
            <span class="input-suffix">pages</span>
          </div>
        </div>

        <div class="field">
          <label for="maxCachedLinks">
            <span class="label-text">Cached Links</span>
            <span class="label-hint">Number of recent links to highlight for quick access</span>
          </label>
          <div class="input-group">
            <input 
              type="number" 
              id="maxCachedLinks" 
              name="maxCachedLinks" 
              min="0" 
              max="100" 
              step="1"
              required
            >
            <span class="input-suffix">links</span>
          </div>
        </div>
      </section>

      <div class="actions">
        <button type="button" id="resetBtn" class="btn btn-secondary">
          Reset to Defaults
        </button>
        <button type="submit" class="btn btn-primary">
          Save Settings
        </button>
      </div>
    </form>

    <div id="toast" class="toast hidden">
      <span id="toastMessage"></span>
    </div>
  </div>

  <script src="options.js" type="module"></script>
</body>
</html>

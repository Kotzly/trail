<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>Your Trail sign-in code</title>
    <style>
      body { margin: 0; padding: 0; background: #fafafa; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; color: #09090b; }
      .wrap { max-width: 480px; margin: 0 auto; padding: 56px 24px 32px; }
      .card { background: #ffffff; border: 1px solid #e4e4e7; border-radius: 16px; padding: 36px; box-shadow: 0 4px 24px -8px rgba(9, 9, 11, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.6); }
      .mark { display: inline-flex; color: #09090b; margin: 0 0 28px; }
      h1 { font-size: 22px; font-weight: 600; line-height: 1.25; color: #09090b; margin: 0 0 10px; letter-spacing: -0.018em; }
      p { font-size: 15px; line-height: 1.6; color: #3f3f46; margin: 0 0 14px; }
      .code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 30px; letter-spacing: 0.42em; font-weight: 600; color: #09090b; background: #f4f4f5; border-radius: 12px; padding: 22px 16px 22px 22px; text-align: center; margin: 22px 0; box-shadow: inset 0 0 0 1px rgba(9, 9, 11, 0.04); }
      .meta { font-size: 13px; color: #71717a; line-height: 1.55; margin: 18px 0 0; }
      .footer { font-size: 12px; color: #a1a1aa; margin: 20px 0 0; padding: 0 4px; }
      .footer a { color: #71717a; text-decoration: none; }
      @media (prefers-color-scheme: dark) {
        body { background: #09090b; color: #fafafa; }
        .card { background: #18181b; border-color: #27272a; box-shadow: 0 4px 24px -8px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.04); }
        .mark { color: #fafafa; }
        h1 { color: #fafafa; }
        p { color: #d4d4d8; }
        .code { background: #27272a; color: #fafafa; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04); }
        .meta { color: #a1a1aa; }
        .footer { color: #52525b; }
        .footer a { color: #a1a1aa; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <span class="mark">
          <svg width="34" height="34" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" aria-label="Trail">
            <g fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
              <path d="M28.13,32.94c14.54,1.86,18.42,8.36,23.83,17.32s-11.6,11.44-5.43,24.84" />
              <path d="M75.13,62.06c-3.27-14.97-15.03,0-23.17-11.8" />
              <path d="M46.53,75.1c8.16,4.41,12.18,11.19,12.75,19.96" />
              <path d="M75.13,62.06c-.02,12.42,1.3,23.99,10.33,30.7" />
              <path d="M75.13,62.06c10.6.06,18.84,5.5,24.73,16.32" />
            </g>
            <g fill="currentColor">
              <circle cx="28.13" cy="32.94" r="4.76" />
              <circle cx="51.96" cy="50.26" r="4.76" />
              <circle cx="75.13" cy="62.06" r="4.76" />
              <circle cx="46.53" cy="75.1" r="4.76" />
              <circle cx="59.28" cy="95.06" r="4.76" />
              <circle cx="85.46" cy="92.77" r="4.76" />
              <circle cx="99.87" cy="78.38" r="4.76" />
            </g>
          </svg>
        </span>
        <h1>Sign in to Trail</h1>
        <p>Enter this code in Trail to sign in.</p>
        <div class="code">{{ .Token }}</div>
        <p class="meta">Expires in 10 minutes. Didn't request a sign-in? Ignore this — no one was signed in.</p>
      </div>
      <div class="footer">
        <a href="https://gettrail.net">gettrail.net</a>
      </div>
    </div>
  </body>
</html>

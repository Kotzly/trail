<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stack History</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">
        <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6h16M4 12h16M4 18h16"/>
          <path d="M12 2v4M12 18v4"/>
        </svg>
        Stack History
      </h1>
      <div class="header-actions">
        <button id="clearBtn" class="btn-icon" title="Clear stack">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
          </svg>
        </button>
        <button id="settingsBtn" class="btn-icon" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="tab-info" id="tabInfo">
      <span class="tab-label">Current Tab</span>
      <span class="tab-count" id="stackCount">0 pages</span>
    </div>

    <div class="stack-container" id="stackContainer">
      <div class="empty-state" id="emptyState">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <p>No history yet</p>
        <span>Start browsing to see your navigation stack</span>
      </div>
      <div class="stack-list" id="stackList"></div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel hidden" id="settingsPanel">
      <div class="settings-header">
        <h2>Settings</h2>
        <button class="btn-icon" id="closeSettingsBtn" title="Close settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      
      <div class="settings-content">
        <!-- Theme -->
        <div class="settings-section">
          <label class="settings-label">Theme</label>
          <div class="theme-options" id="themeOptions">
            <label class="theme-option" data-theme="light">
              <input type="radio" name="theme" value="light">
              <span class="theme-icon">☀️</span>
              <span class="theme-label">Light</span>
            </label>
            <label class="theme-option" data-theme="dark">
              <input type="radio" name="theme" value="dark">
              <span class="theme-icon">🌙</span>
              <span class="theme-label">Dark</span>
            </label>
            <label class="theme-option" data-theme="system">
              <input type="radio" name="theme" value="system">
              <span class="theme-icon">💻</span>
              <span class="theme-label">System</span>
            </label>
          </div>
        </div>

        <!-- View Mode -->
        <div class="settings-section">
          <label class="settings-label">View Mode</label>
          <div class="view-mode-options" id="viewModeOptions"></div>
        </div>

        <!-- Stack Capacity -->
        <div class="settings-section">
          <label class="settings-label">Max history per tab</label>
          <div class="input-group">
            <input type="number" id="stackCapacity" min="10" max="1000" value="100">
            <span class="input-suffix">pages</span>
          </div>
        </div>
      </div>

      <div class="settings-footer">
        <button class="btn btn-secondary" id="resetBtn">Reset</button>
        <button class="btn btn-primary" id="saveBtn">Save</button>
      </div>
    </div>
  </div>

  <script src="sidepanel.js" type="module"></script>
</body>
</html>

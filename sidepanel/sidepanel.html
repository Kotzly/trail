<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trail</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">
        <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v9"/>
          <path d="M12 12l-5 9"/>
          <path d="M12 12l5 9"/>
          <circle cx="12" cy="3" r="1.5" fill="currentColor"/>
          <circle cx="12" cy="12" r="2" fill="currentColor"/>
          <circle cx="7" cy="21" r="1.5" fill="currentColor"/>
          <circle cx="17" cy="21" r="1.5" fill="currentColor"/>
        </svg>
        Trail
      </h1>
      <div class="header-actions">
        <button id="clearBtn" class="btn-icon" title="Clear stack">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
          </svg>
        </button>
        <button id="settingsBtn" class="btn-icon" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="tab-info" id="tabInfo">
      <span class="tab-label">Current Tab</span>
      <span class="tab-count" id="stackCount">0 pages</span>
    </div>

    <div class="stack-container" id="stackContainer">
      <div class="empty-state" id="emptyState">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <p>No history yet</p>
        <span>Start browsing to see your navigation stack</span>
      </div>
      <div class="stack-list" id="stackList"></div>
    </div>

    </div>

    <!-- Context Menu -->
    <div class="context-menu hidden" id="contextMenu">
      <button class="context-menu-item" data-action="open">
        <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
        Open
      </button>
      <button class="context-menu-item" data-action="openNewTab">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Open in New Tab
      </button>
      <button class="context-menu-item" data-action="openNewWindow">
        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        Open in New Window
      </button>
      <div class="context-menu-divider"></div>
      <button class="context-menu-item" data-action="copyUrl">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        Copy URL
      </button>
      <button class="context-menu-item" data-action="copyTitle">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
        Copy Title
      </button>
      <div class="context-menu-divider"></div>
      <button class="context-menu-item multi-tab-only" data-action="muteTab">
        <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/></svg>
        <span class="mute-label">Mute Tab</span>
      </button>
      <button class="context-menu-item multi-tab-only" data-action="pinTab">
        <svg viewBox="0 0 24 24"><path d="M12 2v8M8 6l8 0M9 14l-2 8 5-4 5 4-2-8"/></svg>
        <span class="pin-label">Pin Tab</span>
      </button>
      <button class="context-menu-item multi-tab-only" data-action="duplicateTab">
        <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg>
        Duplicate Tab
      </button>
      <button class="context-menu-item multi-tab-only" data-action="closeTab">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        Close Tab
      </button>
      <div class="context-menu-divider"></div>
      <button class="context-menu-item danger" data-action="removeFromHistory">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        Remove from History
      </button>
    </div>

    <!-- Settings Popover -->
    <div class="settings-popover hidden" id="settingsPopover">
      <div class="popover-section">
        <div class="popover-label">Theme</div>
        <div class="popover-icons" id="themeIcons">
          <button class="popover-icon-btn" data-theme="light" title="Light">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
          </button>
          <button class="popover-icon-btn" data-theme="dark" title="Dark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
            </svg>
          </button>
          <button class="popover-icon-btn" data-theme="system" title="System">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <path d="M8 21h8M12 17v4"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="popover-divider"></div>
      <div class="popover-section">
        <div class="popover-label">View</div>
        <div class="popover-icons" id="viewModeIcons">
          <button class="popover-icon-btn" data-mode="tree" title="Tree">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3v6M12 9l-5 6M12 9l5 6M7 15v3M17 15v3"/>
              <circle cx="12" cy="3" r="2"/>
              <circle cx="7" cy="18" r="2"/>
              <circle cx="17" cy="18" r="2"/>
            </svg>
          </button>
          <button class="popover-icon-btn" data-mode="stack" title="Stack">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="4" y="4" width="16" height="4" rx="1"/>
              <rect x="4" y="10" width="16" height="4" rx="1"/>
              <rect x="4" y="16" width="16" height="4" rx="1"/>
            </svg>
          </button>
          <button class="popover-icon-btn" data-mode="graph" title="Graph">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="5" cy="6" r="3"/>
              <circle cx="19" cy="6" r="3"/>
              <circle cx="12" cy="18" r="3"/>
              <path d="M5 9v3a4 4 0 004 4h6a4 4 0 004-4V9"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="popover-divider"></div>
      <div class="popover-section">
        <label class="popover-toggle">
          <span class="popover-label">Multi-Tab Mode</span>
          <input type="checkbox" id="multiTabToggle">
          <span class="toggle-slider"></span>
        </label>
        <div class="popover-hint">Each page opens in a separate tab</div>
      </div>
      <div class="popover-section multi-tab-options" id="multiTabOptions">
        <div class="popover-row">
          <span class="popover-label-small">Tab Limit</span>
          <input type="number" id="multiTabLimit" min="0" max="50" value="0" class="popover-input-small">
        </div>
        <div class="popover-hint">0 = unlimited</div>
      </div>
    </div>
  </div>

  <script src="sidepanel.js" type="module"></script>
</body>
</html>

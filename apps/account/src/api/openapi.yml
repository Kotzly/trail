openapi: 3.1.0
info:
  title: Trail API
  version: 0.1.0
  description: |
    Public API for Trail clients (extension, dashboard, marketing).
    All endpoints are served from app.gettrail.net and versioned under /api/v1.
servers:
  - url: https://app.gettrail.net/api/v1
  - url: http://localhost:3001/api/v1
security: []

paths:
  /oauth/authorize:
    get:
      summary: OAuth authorization endpoint (Authorization Code + PKCE)
      tags: [auth]
      security: []
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum: [S256]
        - name: prompt
          in: query
          required: false
          schema:
            type: string
            enum: [none, select_account]
        - name: device_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirects to login or to redirect_uri with code/error.
        "400":
          $ref: "#/components/responses/BadRequest"

  /oauth/token:
    post:
      summary: OAuth token endpoint (code exchange and refresh)
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/OAuthTokenCodeGrantRequest"
                - $ref: "#/components/schemas/OAuthTokenRefreshGrantRequest"
      responses:
        "200":
          description: OAuth token response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /oauth/revoke:
    post:
      summary: Revoke refresh token
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthRevokeRequest"
      responses:
        "204":
          description: Token revoked (idempotent).

  /auth/session-state:
    get:
      summary: Resolve current auth session state from bearer/cookie
      tags: [auth]
      security: []
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionState"

  /trails:
    get:
      summary: List trails
      tags: [trails]
      security:
        - userAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
        - name: includeDeleted
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Trails list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrailSummary"
                  nextCursor:
                    type: string
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /trails/sync:
    post:
      summary: Full sync trails (push + pull)
      description: |
        Extension sends full list (active + deleted). Server responds with
        updated trails since clientSyncAt.
      tags: [trails]
      security:
        - extensionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrailSyncRequest"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrailSyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /trails/{id}:
    patch:
      summary: Update trail metadata
      tags: [trails]
      security:
        - userAuth: []
      parameters:
        - $ref: "#/components/parameters/TrailId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrailUpdate"
      responses:
        "200":
          description: Updated trail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrailRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Soft delete trail
      tags: [trails]
      security:
        - userAuth: []
      parameters:
        - $ref: "#/components/parameters/TrailId"
      responses:
        "200":
          description: Deleted (tombstone)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrailRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /trails/{id}/restore:
    post:
      summary: Restore a deleted trail
      tags: [trails]
      security:
        - userAuth: []
      parameters:
        - $ref: "#/components/parameters/TrailId"
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrailRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /onboarding:
    get:
      summary: Get onboarding state
      description: Returns the current onboarding state for the authenticated extension user.
      tags: [onboarding]
      security:
        - extensionAuth: []
      responses:
        "200":
          description: Onboarding state
          content:
            application/json:
              schema:
                type: object
                required: [onboarding]
                properties:
                  onboarding:
                    $ref: "#/components/schemas/OnboardingState"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Complete or skip onboarding
      description: |
        Marks onboarding as completed for the authenticated extension user.
        Both "complete" and "skip" actions set onboardingSeenAt.
      tags: [onboarding]
      security:
        - extensionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingCompleteInput"
      responses:
        "200":
          description: Updated onboarding state
          content:
            application/json:
              schema:
                type: object
                required: [onboarding]
                properties:
                  onboarding:
                    $ref: "#/components/schemas/OnboardingState"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account:
    get:
      summary: Get account snapshot
      tags: [account]
      security:
        - extensionAuth: []
      responses:
        "200":
          description: Account snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSnapshot"

  /plans:
    get:
      summary: List plans
      tags: [billing]
      security: []
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /subscription:
    get:
      summary: Get subscription
      tags: [billing]
      security:
        - extensionAuth: []
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /billing:
    get:
      summary: Get billing status
      tags: [billing]
      security:
        - extensionAuth: []
      responses:
        "200":
          description: Billing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"

  /subscription/checkout:
    post:
      summary: Start checkout
      tags: [billing]
      security:
        - extensionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Checkout link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalLink"

  /billing/portal:
    post:
      summary: Create billing portal link
      tags: [billing]
      security:
        - extensionAuth: []
      responses:
        "200":
          description: Portal link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalLink"

components:
  securitySchemes:
    userAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Better Auth access token
    extensionAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Trail extension access token

  parameters:
    DeviceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    TrailId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: string

    OAuthTokenCodeGrantRequest:
      type: object
      required: [grant_type, code, code_verifier, redirect_uri]
      properties:
        grant_type:
          type: string
          enum: [authorization_code]
        code:
          type: string
        code_verifier:
          type: string
        redirect_uri:
          type: string
          format: uri
        client_id:
          type: string
        device_id:
          type: string

    OAuthTokenRefreshGrantRequest:
      type: object
      required: [grant_type, refresh_token]
      properties:
        grant_type:
          type: string
          enum: [refresh_token]
        refresh_token:
          type: string
        client_id:
          type: string

    OAuthTokenResponse:
      type: object
      required:
        [access_token, token_type, expires_at, refresh_token, refresh_expires_at, scope]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
        scope:
          type: string

    OAuthRevokeRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    AuthSessionStateGuest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [guest]

    AuthSessionStateAuthenticated:
      type: object
      required: [status, source, userId]
      properties:
        status:
          type: string
          enum: [authenticated]
        source:
          type: string
          enum: [web, extension]
        userId:
          type: string
        sessionId:
          type: string
          nullable: true
        authSessionVersion:
          type: integer
          nullable: true

    AuthSessionState:
      oneOf:
        - $ref: "#/components/schemas/AuthSessionStateGuest"
        - $ref: "#/components/schemas/AuthSessionStateAuthenticated"

    DeviceStatus:
      type: string
      enum: [active, revoked]

    Device:
      type: object
      required: [id, userId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        status:
          $ref: "#/components/schemas/DeviceStatus"
        deviceName:
          type: string
          nullable: true
        os:
          type: string
          nullable: true
        locale:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        browserName:
          type: string
          nullable: true
        browserVersion:
          type: string
          nullable: true
        extensionVersion:
          type: string
          nullable: true
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DeviceSession:
      type: object
      required: [id, deviceId, userId, createdAt, updatedAt, expiresAt]
      properties:
        id:
          type: string
        deviceId:
          type: string
        userId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true

    DeviceWithSession:
      allOf:
        - $ref: "#/components/schemas/Device"
        - type: object
          properties:
            session:
              $ref: "#/components/schemas/DeviceSession"

    DeviceClaimRequest:
      type: object
      required: [metadata]
      properties:
        deviceId:
          type: string
          nullable: true
        metadata:
          type: object
          required: [os]
          properties:
            deviceName:
              type: string
              nullable: true
            os:
              type: string
            locale:
              type: string
              nullable: true
            timezone:
              type: string
              nullable: true
            browserName:
              type: string
              nullable: true
            browserVersion:
              type: string
              nullable: true
            extensionVersion:
              type: string
              nullable: true

    DeviceClaimResponse:
      type: object
      required: [device, session]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        session:
          $ref: "#/components/schemas/DeviceSession"
        sessionTtlDays:
          type: integer
          nullable: true

    AccountSettings:
      type: object
      required: [deviceSessionTtlDays]
      properties:
        deviceSessionTtlDays:
          type: integer
          enum: [7, 30, 90, 180, 365]

    AccountSettingsUpdate:
      type: object
      properties:
        deviceSessionTtlDays:
          type: integer
          enum: [7, 30, 90, 180, 365]

    TrailLabelSource:
      type: string
      enum: [user, auto, system]

    TrailSummary:
      type: object
      required:
        [
          id,
          userId,
          deviceId,
          createdAt,
          updatedAt,
          savedAt,
          label,
          labelSource,
          labelUpdatedAt,
          nodeCount,
        ]
      properties:
        id:
          type: string
        userId:
          type: string
        deviceId:
          type: string
        label:
          type: string
        labelSource:
          $ref: "#/components/schemas/TrailLabelSource"
        labelUpdatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        savedAt:
          type: string
          format: date-time
        nodeCount:
          type: integer
        rootUrl:
          type: string
          nullable: true
        rootTitle:
          type: string
          nullable: true
        rootFavicon:
          type: string
          nullable: true
        deletedAt:
          type: string
          format: date-time
          nullable: true

    TrailPayload:
      type: object
      additionalProperties: true

    TrailRecord:
      allOf:
        - $ref: "#/components/schemas/TrailSummary"
        - type: object
          required: [payload]
          properties:
            payload:
              $ref: "#/components/schemas/TrailPayload"

    TrailSyncItem:
      allOf:
        - $ref: "#/components/schemas/TrailRecord"

    TrailSyncRequest:
      type: object
      required: [deviceId, clientSyncAt, trails]
      properties:
        deviceId:
          type: string
        clientSyncAt:
          type: string
          format: date-time
        trails:
          type: array
          items:
            $ref: "#/components/schemas/TrailSyncItem"

    TrailSyncResponse:
      type: object
      required: [serverSyncAt, updates]
      properties:
        serverSyncAt:
          type: string
          format: date-time
        updates:
          type: array
          items:
            $ref: "#/components/schemas/TrailSyncItem"

    TrailUpdate:
      type: object
      properties:
        label:
          type: string
        labelSource:
          $ref: "#/components/schemas/TrailLabelSource"
        deletedAt:
          type: string
          format: date-time
          nullable: true

    Plan:
      type: object
      required: [id, name, tier, priceMonthly, priceYearly, currency, features]
      properties:
        id:
          type: string
        name:
          type: string
        tier:
          type: string
        priceMonthly:
          type: number
        priceYearly:
          type: number
        currency:
          type: string
        features:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties: true
        highlight:
          type: boolean
          nullable: true
        rank:
          type: integer
          nullable: true

    Subscription:
      type: object
      required:
        [
          id,
          planId,
          status,
          interval,
          currentPeriodStart,
          currentPeriodEnd,
          cancelAtPeriodEnd,
        ]
      properties:
        id:
          type: string
        planId:
          type: string
        status:
          type: string
        interval:
          type: string
        currentPeriodStart:
          type: string
          format: date-time
        currentPeriodEnd:
          type: string
          format: date-time
        cancelAtPeriodEnd:
          type: boolean
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        canceledAt:
          type: string
          format: date-time
          nullable: true

    BillingStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
        lastChargeAt:
          type: string
          format: date-time
          nullable: true
        nextChargeAt:
          type: string
          format: date-time
          nullable: true
        graceEndsAt:
          type: string
          format: date-time
          nullable: true
        paymentMethod:
          type: object
          nullable: true
          properties:
            brand:
              type: string
            last4:
              type: string
            expMonth:
              type: integer
            expYear:
              type: integer
        failureReason:
          type: string
          nullable: true

    User:
      type: object
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    AuthSession:
      oneOf:
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [guest]
        - type: object
          required: [status, accessToken]
          properties:
            status:
              type: string
              enum: [authenticated]
            accessToken:
              type: string
            refreshToken:
              type: string
              nullable: true
            expiresAt:
              type: string
              format: date-time
              nullable: true

    OnboardingState:
      type: object
      required: [flowId, status, seenAt]
      properties:
        flowId:
          type: string
          enum: [activation-v1]
        status:
          type: string
          enum: [pending, completed]
        seenAt:
          type: string
          format: date-time
          nullable: true

    OnboardingCompleteInput:
      type: object
      properties:
        action:
          type: string
          enum: [complete, skip]
          default: complete
        source:
          type: string
          enum: [extension, web]
          default: extension

    AccountSnapshot:
      type: object
      required: [session, user, subscription, billing, plans, onboarding]
      properties:
        session:
          $ref: "#/components/schemas/AuthSession"
        user:
          $ref: "#/components/schemas/User"
        subscription:
          $ref: "#/components/schemas/Subscription"
          nullable: true
        billing:
          $ref: "#/components/schemas/BillingStatus"
        plans:
          type: array
          items:
            $ref: "#/components/schemas/Plan"
        onboarding:
          $ref: "#/components/schemas/OnboardingState"

    CheckoutInput:
      type: object
      required: [planId, interval]
      properties:
        planId:
          type: string
        interval:
          type: string
        successUrl:
          type: string
          format: uri
          nullable: true
        cancelUrl:
          type: string
          format: uri
          nullable: true

    PortalLink:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
          nullable: true
